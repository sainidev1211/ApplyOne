<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Job Application Automation Platform | ApplyOne</title>

    <meta
      name="description"
      content="ApplyOne is a job application automation platform for students, freshers, and professionals. Discover jobs and internships, manage your resume, and automate job applications."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.applyone.co.in/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Job Application Automation Platform | ApplyOne"
    />

    <meta
      property="og:description"
      content="Discover jobs and internships, manage your resume, and automate job applications with ApplyOne."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://www.applyone.co.in/"
    />

    <meta
      property="og:site_name"
      content="ApplyOne"
    />

    <meta
      property="og:image"
      content="https://www.applyone.co.in/logo.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Job Application Automation Platform | ApplyOne"
    />

    <meta
      name="twitter:description"
      content="Discover jobs and internships, manage your resume, and automate job applications with ApplyOne."
    />

    <meta
      name="twitter:image"
      content="https://www.applyone.co.in/logo.png"
    />

    <!-- Browser theme -->
    <meta
      name="theme-color"
      content="#ffffff"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite / React entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
